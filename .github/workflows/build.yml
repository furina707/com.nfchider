name: Build

on:
  # 仅手动触发构建，避免每次推送代码都创建新版本
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 自动递增 versionCode：查询最新 Release 标签，取 max(最新release+1, 当前+1)，
      # 避免手动忘记改版本号导致 Release 标签冲突/覆盖。
      - name: Auto-bump versionCode
        id: get_version
        run: |
          set -e
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2 | tr -d '\r')
          CURRENT_CODE=$(grep '^versionCode=' module.prop | cut -d'=' -f2 | tr -d '\r')

          # 查询最新 Release 的 versionCode（标签格式为 code-version）
          LATEST_CODE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | grep -oP '"tag_name":\s*"\K[0-9]+' | head -1)

          if [ -z "$LATEST_CODE" ]; then
            LATEST_CODE=0
          fi

          # 新版本号 = max(最新release + 1, 当前module.prop + 1)
          NEW_CODE=$((LATEST_CODE + 1))
          if [ "$NEW_CODE" -le "$CURRENT_CODE" ]; then
            NEW_CODE=$((CURRENT_CODE + 1))
          fi

          TAG="${NEW_CODE}-${VERSION}"
          echo "versionCode=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Bumping versionCode: ${CURRENT_CODE} -> ${NEW_CODE} (tag: ${TAG})"

          # 更新所有版本文件
          sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" app/src/main/resources/META-INF/xposed/module.prop
          sed -i "s/versionCode = ${CURRENT_CODE}/versionCode = ${NEW_CODE}/" app/build.gradle.kts

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/NfcHider-*.apk artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NfcHider-${{ github.run_number }}
          path: artifacts/

      - name: Package source code (all files)
        run: |
          mkdir -p artifacts
          zip -r artifacts/NfcHider-source.zip . -x 'artifacts/NfcHider-source.zip'
          echo "All files packaged (including hidden files)"

      # 删除旧的 Actions 运行历史（保留最近 1 次）
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      # 按照 Xposed-Modules-Repo 规范创建新 Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          files: artifacts/NfcHider-${{ steps.get_version.outputs.tag }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 将自动递增的版本号回写到仓库，避免下次构建覆盖。
      # [skip ci] 防止提交本身再次触发工作流造成无限循环。
      - name: Commit version bump
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.prop app/src/main/resources/META-INF/xposed/module.prop app/build.gradle.kts
          git commit -m "ci: bump version to ${{ steps.get_version.outputs.tag }} [skip ci]"
          git push

      # Xposed-Modules-Repo 组织无法运行 Actions，因此由本仓库 CI 代为同步：
      # 1. 将更新后的 module.prop 推送到 Xposed-Modules-Repo/com.nfchider
      # 2. 在该仓库创建同名 Release 并附上 APK
      # 需要在本仓库 Settings > Secrets 中配置 XPOSED_REPO_TOKEN（有该仓库写权限的 PAT）
      - name: Sync to Xposed-Modules-Repo
        if: success()
        run: |
          set -e
          REPO="Xposed-Modules-Repo/com.nfchider"
          TAG="${{ steps.get_version.outputs.tag }}"
          APK="artifacts/NfcHider-${TAG}.apk"

          # 1. 克隆 Xposed-Modules-Repo 并更新 module.prop
          git clone --depth 1 "https://x-access-token:${{ secrets.XPOSED_REPO_TOKEN }}@github.com/${REPO}.git" /tmp/xposed-repo
          cp module.prop /tmp/xposed-repo/module.prop
          cd /tmp/xposed-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.prop
          git commit -m "update: ${TAG}" || echo "module.prop 无变化，跳过提交"
          git push

          # 2. 在 Xposed-Modules-Repo 创建 Release 并上传 APK
          cd "${GITHUB_WORKSPACE}"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.XPOSED_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false}" \
            -o /tmp/release.json

          UPLOAD_URL=$(grep -oP '"upload_url":\s*"\K[^"]+' /tmp/release.json | sed 's/{?name,label}//')
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.XPOSED_REPO_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${UPLOAD_URL}?name=NfcHider-${TAG}.apk" \
            --data-binary @"${APK}" \
            -o /dev/null
          echo "已同步到 Xposed-Modules-Repo: ${TAG}"


